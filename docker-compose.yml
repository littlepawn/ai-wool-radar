# 全功能版：只有一个服务。
# wool：app/service.py 一个进程完成自动发现、自动评估、自动刷新与页面服务，
# 档位为北京时间 08:30 / 13:00 / 18:30（可用 SERVICE_SLOTS 改）。
# AI 评估是可选项：.env 里配了 AI_API_KEY + AI_MODEL 才调 AI，否则全走启发式。
services:
  wool:
    build: .
    ports:
      - "${PORT:-8080}:8080"
    env_file:
      - path: .env
        required: false
    volumes:
      - ./state:/app/state
    restart: unless-stopped
