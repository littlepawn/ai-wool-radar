# 轻量版：只有一个服务。
# wool：生成页面 + 提供页面 + 按 08:30 / 13:00 / 18:30（北京时间）
# 定时重新生成并跑检查器，全部在 app/light.py 一个进程里完成。
# 不需要原来的 web + checker 两个服务，也不需要容器内 cron。
services:
  wool:
    build:
      context: .
      dockerfile: Dockerfile.light
    ports:
      - "${PORT:-8080}:8080"
    env_file:
      - path: .env
        required: false
    volumes:
      - ./state:/app/state
    restart: unless-stopped
